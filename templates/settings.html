<form class="rnk-reserves-settings">
  <h2>{{localize "RNKRESERVES.Menu.ManagementName"}}</h2>
  <div class="form-group">
    <label>{{localize "RNKRESERVES.Settings.TargetActorLabel"}}</label>
    <div class="form-fields">
      <input type="text" name="targetActorUuid" value="{{targetActorUuid}}" placeholder="{{localize 'RNKRESERVES.Settings.TargetActorPlaceholder'}}">
      <button type="button" class="rnk-get-uuid" title="{{localize 'RNKRESERVES.Settings.GetSelectedToken'}}">
        <i class="fas fa-crosshairs"></i>
      </button>
    </div>
    <p class="notes">{{localize "RNKRESERVES.Settings.TargetActorHint"}}</p>
  </div>

  <hr>

  <h3>{{localize "RNKRESERVES.Settings.SectionAdd"}}</h3>
  <div class="form-group">
    <label>{{localize "RNKRESERVES.Settings.PointsToAdd"}}</label>
    <div class="form-fields">
      <input type="number" name="pointsToAdd" value="1" min="1" step="1">
    </div>
  </div>

  <div class="form-group">
    <button type="button" class="rnk-award-points">
      <i class="fas fa-plus"></i> {{localize "RNKRESERVES.Settings.AwardButton"}}
    </button>
  </div>

  <hr>

  <h3>{{localize "RNKRESERVES.Settings.SectionLog"}}</h3>
  <div class="form-group">
    <button type="button" class="rnk-open-log-viewer">
      <i class="fas fa-book"></i> {{localize "RNKRESERVES.Settings.ViewLogButton"}}
    </button>
  </div>
</form>
